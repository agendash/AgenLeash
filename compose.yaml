services:
  agenleash:
    build:
      context: .
    image: ghcr.io/agendash/agenleash:latest
    user: "${AGENLEASH_UID:-1000}:${AGENLEASH_GID:-1000}"
    restart: unless-stopped
    environment:
      HOME: /home/agenleash
      CODEX_HOME: /data/agents/.codex
      AGENLEASH_TOKEN: ${AGENLEASH_TOKEN}
      AGENLEASH_ADDR: 0.0.0.0:8081
      AGENLEASH_ENABLE_WEB: ${AGENLEASH_ENABLE_WEB:-}
      AGENLEASH_ADAPTER_DIR: /usr/local/share/agenleash/adapters
      AGENLEASH_DATA_DIR: /var/lib/agenleash
      AGENLEASH_CLAUDE_HOME: /data/agents/.claude
      AGENLEASH_CODEX_HOME: /data/agents/.codex
      AGENLEASH_OPENCODE_HOME: /data/agents/opencode
      AGENLEASH_ALLOWED_WORKSPACE_ROOTS: /workspaces
      XDG_CACHE_HOME: /home/agenleash/.cache
      XDG_CONFIG_HOME: /home/agenleash/.config
      XDG_DATA_HOME: /home/agenleash/.local/share
      XDG_STATE_HOME: /home/agenleash/.local/state
      PATH: /opt/agent-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${AGENLEASH_PORT:-8081}:8081"
    volumes:
      - ./docker-data:/var/lib/agenleash
      - ${AGENLEASH_CLAUDE_HOST_DIR}:/data/agents/.claude:ro
      - ${AGENLEASH_CODEX_HOST_DIR}:/data/agents/.codex:ro
      - ${AGENLEASH_OPENCODE_HOST_DIR}:/data/agents/opencode:ro
      - ${AGENLEASH_WORKSPACE_HOST_DIR}:/workspaces
      - ${AGENLEASH_AGENT_BIN_HOST_DIR:-./agent-bin}:/opt/agent-bin:ro
